# there may be other dependencies manually ignored.
# search `"@dependabot ignore" in:comments` in the repo to see them.
#
# reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # only do patch updates for containerd and co: don't bump anything else
      - dependency-name: "github.com/containerd/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ignore patch version increment updates to avoid churn
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    # allow more PRs to clear queue faster
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - dependencies
      - go
      - tests
    ignore:
      # keep containerd and related dependencies in sync with the shim/the root repo
      - dependency-name: "github.com/containerd/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # codeql.yml pins `init`, `analyze`, and `upload-sarif` individually, but the CodeQL
      # action requires every step in a run to be on the same version: `init` stamps its
      # version into the config that `analyze` later loads, so a mismatch fails the job with
      # "Loaded a configuration file for version X, but running version Y".
      # Dependabot treats each sub-action as a separate dependency, so ungrouped they arrive
      # as separate PRs and CodeQL stays broken until the last one merges. Bump them together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Keep the test base images (nanoserver/servercore + golang) current: scans every
  # Dockerfile (except vendored), digest/patch bumps only (major/minor ignored), one grouped PR.
  - package-ecosystem: "docker"
    directories:
      - "/**/*"
    exclude-paths:
      - "vendor/**"
    allow:
      # Dependabot's docker dependency name strips the registry host, so these are the
      # image names exactly as they appear in the PR (e.g. "Updates windows/nanoserver ...").
      - dependency-name: "windows/nanoserver"
      - dependency-name: "windows/servercore"
      # golang toolchain base image used by the test images (Docker Hub official image)
      - dependency-name: "golang"
    ignore:
      # keep the tag stable and only bump the digest / patch level.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      # run every 3 days at 08:00 UTC (note: `*/3` day-of-month resets on the 1st of each month)
      interval: "cron"
      cronjob: "0 8 */3 * *"
      timezone: "Etc/UTC"
    groups:
      microsoft_docker_images:
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
      - tests
    open-pull-requests-limit: 5
