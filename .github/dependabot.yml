# there may be other dependencies manually ignored.
# search `"@dependabot ignore" in:comments` in the repo to see them.
#
# reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    ignore:
      # only do patch updates for containerd and co: don't bump anything else
      - dependency-name: "github.com/containerd/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # ignore patch version increment updates to avoid churn
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    # allow more PRs to clear queue faster
    open-pull-requests-limit: 10

  - package-ecosystem: "gomod"
    directory: "/test"
    schedule:
      interval: "weekly"
      day: "sunday"
    labels:
      - dependencies
      - go
      - tests
    ignore:
      # keep containerd and related dependencies in sync with the shim/the root repo
      - dependency-name: "github.com/containerd/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5

  # Keep the Windows base images (nanoserver/servercore) on their latest digest: scans
  # every Dockerfile (except vendored), bumps the digest only (tag kept), one grouped PR.
  - package-ecosystem: "docker"
    directories:
      - "/**/*"
    exclude-paths:
      - "vendor/**"
    allow:
      # Dependabot's docker dependency name strips the registry host, so these are the
      # image names exactly as they appear in the PR (e.g. "Updates windows/nanoserver ...").
      - dependency-name: "windows/nanoserver"
      - dependency-name: "windows/servercore"
    ignore:
      # keep the tag stable and only bump the digest / patch level.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    schedule:
      # run every 3 days at 08:00 UTC (note: `*/3` day-of-month resets on the 1st of each month)
      interval: "cron"
      cronjob: "0 8 */3 * *"
      timezone: "Etc/UTC"
    groups:
      microsoft_docker_images:
        patterns:
          - "*"
    labels:
      - dependencies
      - docker
      - tests
    open-pull-requests-limit: 5
